name: macos-desktop

# Builds the Electron desktop app on macOS. Dispatch-only, since macOS
# runners cost a 10x minute multiplier on private repos.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image"
        type: choice
        options:
          - macos-15
          - macos-26
        default: macos-15

jobs:
  desktop:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Report machine
        run: |
          sw_vers
          uname -m

      - uses: oven-sh/setup-bun@v2
        with:
          # match the version this repo's bun.lock was generated with
          bun-version: 1.3.11

      # Not --frozen-lockfile: the committed bun.lock is stale against the
      # committed package.json set and fails to verify.
      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Build desktop app
        run: bun --filter '@nib-ui/desktop' build
